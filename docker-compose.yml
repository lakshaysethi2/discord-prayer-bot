version: "3.9"

services:
  bot:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: prayer-bot
    volumes:
      - ./data:/app/data
      - ./media/prayers:/app/media/prayers
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-dev-token-change-me}
      - DATABASE_PATH=/app/data/prayer_bot.db
      - PYTHONPATH=/app
      - GIT_SHA=${GIT_SHA:-unknown}
    restart: unless-stopped
    command: python bot/main.py

  dashboard:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: prayer-dashboard
    ports:
      - "8700:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/prayer_bot.db
      - PYTHONPATH=/app
      - ADMIN_TOKEN=${ADMIN_TOKEN:-dev-token-change-me}
      - GIT_SHA=${GIT_SHA:-unknown}
    restart: unless-stopped
    command: uvicorn dashboard.app:app --host 0.0.0.0 --port 8000

  cypress:
    image: cypress/included:14.3.0
    container_name: prayer-cypress
    profiles:
      - e2e
    volumes:
      - .:/e2e
    working_dir: /e2e
    environment:
      - CYPRESS_ADMIN_TOKEN=${ADMIN_TOKEN:-dev-token-change-me}
    entrypoint: ["cypress"]
