services:
  bot:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: prayer-bot
    volumes:
      - ./data:/app/data
      - ./media/prayers:/app/media/prayers
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - ADMIN_TOKEN=${ADMIN_TOKEN:?set ADMIN_TOKEN in .env — see .env.example}
      - DATABASE_PATH=/app/data/prayer_bot.db
      - PYTHONPATH=/app
      - GIT_SHA=${GIT_SHA:-unknown}
    restart: unless-stopped
    command: python bot/main.py

  dashboard:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: prayer-dashboard
    ports:
      - "127.0.0.1:8700:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/prayer_bot.db
      - PYTHONPATH=/app
      - ADMIN_TOKEN=${ADMIN_TOKEN:?set ADMIN_TOKEN in .env — see .env.example}
      - GIT_SHA=${GIT_SHA:-unknown}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4)"]
      interval: 60s
      timeout: 10s
      retries: 3
    command: uvicorn dashboard.app:app --host 0.0.0.0 --port 8000
